{% set name = "nhs-number" %}
{% set version = "1.3.6" %}


package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/nhs_number-{{ version }}.tar.gz
  sha256: 5effca980ce7bb6734f07a7843816ae952166767511c3edf179b8fdcde8713e5

build:
  number: 0
  noarch: python
  script: {{ PYTHON }} -m pip install . -vv

requirements:
  host:
    - pip
    - python >=2.7
  run:
    - python >=2.7

test:
  imports:
    - nhs_number
  commands:
    - pip check
  requires:
    - pip

about:
  home: https://github.com/andylaw/NhsNumberChecks
  summary: Python library for checking the validity of NHS Numbers
  license: MIT
  license_file: LICENSE

extra:
  recipe-maintainers:
    - andylaw
